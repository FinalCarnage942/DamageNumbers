# DamageNumbers Configuration for Paper 1.21.8
# Uses legacy '&' color codes (&c=red, &l=bold, &a=green, etc) and placeholders (%s=value)

# Hologram text formats (damage, critical hits, healing)
formats:
  normal: "&c&l%s DMG"
  critical: "&e&l%s &4✧"
  healing: "&a&l+%s ❤"

# Enable console logging for debugging hologram spawning and damage detection
debug: false

# Cooldown (ms) between hologram spawns to prevent spam
cooldown-ms: 10

# What events trigger holograms
triggers:
  # Player hitting mobs (zombies, cows, etc)
  player-vs-mob: true
  # Mobs hitting players
  mob-vs-player: false
  # Player vs player combat
  player-vs-player: true
  # Healing from potions, regeneration, etc
  healing: true
  # Don't show holograms for invisible entities
  ignore-invisible: true
  # Entity types to skip
  ignored-entity-types:
    - ARMOR_STAND
    - ITEM_FRAME
    - GLOW_ITEM_FRAME

# Damage hologram visibility settings
display:
  # 'damager' = only attacker sees it, 'everyone' = all players in range
  visibility: damager
  # Max distance (blocks) for players to see damage numbers
  view-range: 48.0
  # Spawn position offset from entity center
  offset:
    x: 0.0
    y: 0.8   # Height above entity
    z: 0.0
  # Random spread (blocks) to avoid overlap of multiple hits
  random-offset: 0.4

# Hologram animation and movement
animation:
  # How long (ticks) the hologram stays visible (50 ticks = ~2.5 sec)
  fade-duration: 50
  # How fast the text rises (blocks per tick)
  rise-speed: 0.08
  # Slight bounce effect during initial rise
  bounce: true
  # Shake effect on critical hits
  shake-on-crit: true
  # Rotation speed (0.0 = no spin)
  spin-speed: 0.0

# Healing-specific settings
healing:
  # 'healer' = only healed player sees it, 'all' = everyone in range
  visibility: all
  # Max distance (blocks) for players to see healing numbers
  view-range: 24.0
  # Cooldown between healing displays (ms)
  cooldown-ms: 10
  # Time window (ms) to combine multiple healing events
  stack-window-ms: 1000
  # Delay (ticks) before showing combined healing hologram
  stack-delay-ticks: 10

# Advanced tuning
advanced:
  # Delay (ticks) before showing damage hologram (0 = instant)
  delay-ticks: 0
  # Delay before showing healing hologram
  healing-delay-ticks: 0
  # Combine rapid hits/healing into single holograms
  stacking:
    # Combine rapid damage hits
    enabled: false
    # Combine rapid healing ticks
    healing-enabled: true
    # Time window (ms) to stack damage
    window-ms: 300
    # Delay (ticks) before showing stacked damage
    delay-ticks: 5
  # How long (ticks) holograms display (overrides fade-duration)
  lifetime:
    normal: 50
    critical: 50
    healing: 50
  # Sound effects when holograms spawn
  sounds:
    # Normal damage sound (empty = none)
    normal: ""
    # Critical hit sound
    critical: "ENTITY_EXPERIENCE_ORB_PICKUP"
    # Healing sound
    healing: "ENTITY_PLAYER_LEVELUP"
    # Volume (0.0 to 1.0)
    volume: 0.6
    # Pitch (0.5 to 2.0, 1.0 = default)
    pitch: 1.0
